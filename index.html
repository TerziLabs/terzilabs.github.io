<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terzi Labs — Mobile Games</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #132866 0%, #081029 65%);
      color: #eef4ff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      width: 100%;
      background: #10204d;
      border: 3px solid #2f57b8;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    h1 { margin: 0 0 8px; color: #ffd447; }
    p { color: #b5caf7; line-height: 1.6; }
    a { color: #8ad4ff; font-weight: 600; }
    .box {
      margin-top: 18px;
      padding: 14px 16px;
      background: rgba(8, 16, 41, 0.65);
      border: 1px solid rgba(255, 212, 71, 0.35);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Terzi Labs</h1>
    <p>Independent mobile game studio by Oltan Terzi &bull; Istanbul, Türkiye</p>
    <div class="box">
      <strong>Toybox Blitz</strong> (<code>com.terzilabs.toyboxblitz</code>)<br />
      <a href="/toybox-blitz/">Gizlilik Politikası (TR)</a> &bull;
      <a href="/toybox-blitz/#en">Privacy Policy (EN)</a>
    </div>
    <p style="margin-top:18px; font-size:0.92rem;">
      Contact / İletişim: <a href="mailto:terzilabs@gmail.com">terzilabs@gmail.com</a>
    </p>
  </main>
</body>
</html>
